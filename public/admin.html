<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkerWise Admin</title><link rel="stylesheet" href="/fresh-ui.css"></head><body data-role="admin"><div class="shell"><header><b>🎀 WorkerWise</b><span>Admin · <strong id="identity">Connecting…</strong></span></header><nav><button data-page="tasks">Tasks</button><button data-page="earnings">Earnings</button><button data-page="chat">Chat</button></nav><main><div id="notice" class="notice hidden"></div><section class="panel" id="p-tasks"><h2>📋 Task Management</h2><form class="card" id="new-task"><h3>Create New Task</h3><div class="formgrid"><label>Task title<input name="title" required maxlength="160"></label><label>Estimated amount (USD)<input name="amount" type="number" min="0" step="0.01" value="0"></label><label>Assignment<select name="workerId" id="worker-select"><option value="">Open Task — All Workers</option></select></label></div><p class="muted">Leave worker unselected to publish an Open Task. Select a worker for Direct Assignment.</p><label>Description<textarea name="description"></textarea></label><p><button>Create Task</button></p></form><div id="admin-task-list" class="stack"></div></section><section class="panel" id="p-earnings"><h2>💰 Earnings & Payments</h2><div class="card"><span class="muted">Total recorded earnings</span><div class="number" id="earn-total">$0.00</div></div><div id="earn-list"></div></section><section class="panel" id="p-chat"><h2>💬 Worker Conversations</h2><div class="card"><label>Worker<select id="chat-worker"></select></label><div id="chat-log" class="chat"></div><form id="chat-form" class="chatbar"><input id="chat-input" maxlength="2000" placeholder="Message worker…" required><button>Send</button></form></div></section></main></div><script src="/socket.io/socket.io.js"></script><script src="/fresh-app.js"></script></body></html>
