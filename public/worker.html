<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkerWise Worker</title><link rel="stylesheet" href="/fresh-ui.css"></head><body data-role="worker"><div class="shell"><header><b>🎀 WorkerWise</b><span>Worker · <strong id="identity">Connecting…</strong></span></header><nav><button data-page="timer">Timer</button><button data-page="tasks">Tasks</button><button data-page="earnings">Earnings</button><button data-page="chat">Chat</button></nav><main><div id="notice" class="notice hidden"></div><section class="panel" id="p-timer"><h2>⏱️ Work Timer</h2><div class="card"><div id="timer-display" class="timer">00:00:00</div><p class="muted" style="text-align:center" id="timer-status">Loading…</p><div class="row" style="justify-content:center"><button id="timer-start">Start</button><button id="timer-pause" class="secondary">Pause</button><button id="timer-resume">Resume</button></div></div></section><section class="panel" id="p-tasks"><h2>📋 My Tasks</h2><h3>Ongoing Task</h3><div id="ongoing-list"></div><h3>Available & Direct Assignments</h3><div id="available-list"></div><h3>Submitted & Completed</h3><div id="history-list"></div></section><section class="panel" id="p-earnings"><h2>💰 My Earnings</h2><div class="grid"><div class="card"><span class="muted">Total Approved</span><div class="number" id="earn-total">$0.00</div></div><div class="card"><span class="muted">Pending (48 hours)</span><div class="number" id="earn-pending">$0.00</div></div><div class="card"><span class="muted">Available for Withdrawal</span><div class="number" id="earn-available">$0.00</div></div><div class="card"><span class="muted">Paid</span><div class="number" id="earn-paid">$0.00</div></div></div><h3>Earnings History</h3><div id="earn-list"></div></section><section class="panel" id="p-chat"><h2>💬 Admin Chat</h2><div class="card"><div id="chat-log" class="chat"></div><form id="chat-form" class="chatbar"><input id="chat-input" maxlength="2000" placeholder="Message Admin…" required><button>Send</button></form></div></section></main></div><script src="/socket.io/socket.io.js"></script><script src="/fresh-app.js"></script></body></html>
